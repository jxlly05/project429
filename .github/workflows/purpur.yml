name: Purpur Server Start - Nur WeltMitKurosh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  start-server:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken – initial nur Kern-Dateien & eine Welt laden
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            minecraft_server/bukkit.yml
            minecraft_server/commands.yml
            minecraft_server/eula.txt
            minecraft_server/help.yml
            minecraft_server/ops.json
            minecraft_server/permissions.yml
            minecraft_server/purpur.jar
            minecraft_server/purpur.yml
            minecraft_server/server.log
            minecraft_server/server.pid
            minecraft_server/server.properties
            minecraft_server/server_output.log
            minecraft_server/spigot.yml
            minecraft_server/usercache.json
            minecraft_server/version_history.json
            minecraft_server/whitelist.json
            minecraft_server/banned-ips.json
            minecraft_server/banned-players.json
            minecraft_server/cache
            minecraft_server/config
            minecraft_server/libraries
            minecraft_server/logs
            minecraft_server/plugins
            minecraft_server/versions
            minecraft_server/WeltMitKurosh
            minecraft_server/WeltMitKurosh_nether
            minecraft_server/WeltMitKurosh_the_end

      # 1b. Force-reset auf neuesten Stand
      - name: Reset to latest
        run: |
          git fetch origin main
          git reset --hard origin/main

      # 2. Java 21 installieren
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 3. RAM & Festplattenplatz prüfen
      - name: Check system memory and disk space
        run: |
          echo "==== RAM ===="
          free -h
          echo ""
          echo "==== Festplattenplatz auf Runner ===="
          df -h /

      # 4. Autosave + Minecraft Server Start
      - name: Start AutoSave & Minecraft Server + Hintergrund-Welt-Nachladen
        run: |
          echo "[Autosave] Starte Hintergrund-Autosave-Prozess..."
          {
            while true; do
              cd "$GITHUB_WORKSPACE"
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"

              git add -A minecraft_server || true
              git commit -m "Force push Minecraft server data $(date)" >/dev/null 2>&1 || true
              git push origin HEAD:main --force >/dev/null 2>&1 || true

              echo "[Autosave] Repo save done at $(date '+%H:%M:%S')"
              sleep 60
            done
          } &
          AUTOSAVE_PID=$!
          echo "[Autosave] Hintergrundprozess gestartet mit PID $AUTOSAVE_PID"

          echo "[Loader] Lade zusätzliche Welten im Hintergrund..."
          {
            git sparse-checkout add \
              minecraft_server/flatworld \
              minecraft_server/Luebeck \
              minecraft_server/Survival \
              minecraft_server/Survival_nether \
              minecraft_server/Survival_the_end \
              minecraft_server/Island

            git fetch --all --quiet
            git checkout .
            echo "[Loader] Zusätzliche Welten erfolgreich geladen."
            echo "==== Festplattenplatz auf Runner ===="
            df -h /
          } &

          echo "[Server] Starte Minecraft Server..."
          cd "$GITHUB_WORKSPACE/minecraft_server"
          java -Xms14G -Xmx14G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=15 -jar purpur.jar nogui

          echo "[Autosave] Serverprozess beendet – beende Autosave-Prozess..."
          kill "$AUTOSAVE_PID" 2>/dev/null || true
          echo "[Autosave] Autosave vollständig gestoppt."

      # 5. Finaler Commit/PUSH
      - name: Force-push server data to repo
        run: |
          sleep 10
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          [ -f ".git/index.lock" ] && rm -f .git/index.lock

          git add -A minecraft_server
          git commit -m "Auto-save Minecraft server data" || echo "No changes to commit"

          while true; do
            echo "[Autosave] Versuche, Änderungen zu pushen..."
            if git push origin HEAD:main --force; then
              echo "[Autosave] Push erfolgreich!"
              break
            else
              echo "[Autosave] Push fehlgeschlagen, warte 10 Sekunden..."
              sleep 10
            fi
          done
