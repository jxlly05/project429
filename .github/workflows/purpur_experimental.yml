name: Purpur Server Start Experimental

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  start-server:
    runs-on: ubuntu-latest

    steps:
      # 1. Minimal-Checkout – nur ops.json holen
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1                # nur letzter Commit
          persist-credentials: true
          sparse-checkout: |
            minecraft_server/ops.json

      # 1b. Force-reset auf neuesten Stand – jetzt den ganzen minecraft_server laden
      - name: Reset to latest and fetch full minecraft_server
        run: |
          echo "[Git] Hole vollständige Daten..."
          git sparse-checkout disable
          git fetch origin main
          git reset --hard origin/main
          echo "[Git] Vollständiger minecraft_server-Ordner synchronisiert."


      # 2. Java 21 installieren
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 3. RAM prüfen
      - name: Check available RAM
        run: free -h

      # 4. Minecraft Server starten (max 15 GB RAM) + Autosave im Hintergrund
      - name: Start AutoSave & Minecraft Server
        run: |
          cd "$GITHUB_WORKSPACE/minecraft_server"
          java -Xms14G -Xmx14G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=15 -jar purpur.jar nogui
