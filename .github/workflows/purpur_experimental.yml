name: Purpur Server Start - Experimental

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  start-server:
    runs-on: ubuntu-latest

    steps:

      # 0. Minecraft Daten aus Cache wiederherstellen
      - name: Restore cached Minecraft server data
        uses: actions/cache@v4
        with:
          path: minecraft_server
          key: cache-minecraft-server

      # 1. Repo checkout – aber vorhandene Dateien beibehalten
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      # 1b. Nur geänderte Dateien vom Repo aktualisieren
      - name: Update to latest repo state
        run: |
          git fetch origin main
          git reset --mixed origin/main
          echo "[Update] Lokale Dateien aktualisiert, ohne Weltstände zu überschreiben."

      # 2. Java 21 installieren
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 3. RAM & Festplattenplatz prüfen
      - name: Check system memory and disk space
        run: |
          echo "==== RAM ===="
          free -h
          echo ""
          echo "==== Festplattenplatz ===="
          df -h /

      # 4. Autosave + Minecraft Server Start
      - name: Start AutoSave & Minecraft Server + Hintergrund-Welt-Nachladen
        run: |
          echo "[Autosave] Starte Hintergrund-Autosave-Prozess..."
          {
            while true; do
              echo "[Autosave] (Experimental) Kein tatsächliches Saving aktiv."
              sleep 60
            done
          } &
          AUTOSAVE_PID=$!
          echo "[Autosave] PID = $AUTOSAVE_PID"

          echo "[Server] Starte Minecraft Server..."
          cd "$GITHUB_WORKSPACE/minecraft_server"
          java -Xms14G -Xmx14G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=15 -jar purpur.jar nogui

          echo "[Autosave] Serverprozess beendet → Autosave Prozess stoppen..."
          kill "$AUTOSAVE_PID" 2>/dev/null || true
          echo "[Autosave] Autosave gestoppt."

      # 5. Serverdaten ins Repo saven & pushen
      - name: Commit and push world/server data
        run: |
          sleep 10
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          [ -f ".git/index.lock" ] && rm -f .git/index.lock

          git add -A minecraft_server
          git commit -m "Auto-save Minecraft server data" || echo "No changes to commit"

          while true; do
            echo "[Push] Versuche zu pushen..."
            if git push origin HEAD:main --force; then
              echo "[Push] Erfolgreich!"
              break
            else
              echo "[Push] Fehlgeschlagen → erneuter Versuch in 10 Sekunden..."
              sleep 10
            fi
          done

      # 6. Cache speichern (wird *automatisch nach dem Job* passieren)
      - name: Save Minecraft cache layer
        uses: actions/cache@v4
        with:
          path: minecraft_server
          key: cache-minecraft-server
