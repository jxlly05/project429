name: Purpur Server Start Experimental

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  start-server:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository minimal klonen (nur letzter Commit)
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1   # nur letzter Commit
          persist-credentials: true

      # 1b. Nur die Datei ops.json initial holen (andere ignorieren)
      - name: Keep only ops.json
        run: |
          echo "[Setup] Bereinige alles außer ops.json..."
          find minecraft_server -mindepth 1 -not -name 'ops.json' -exec rm -rf {} +
          echo "[Setup] Nur ops.json bleibt erhalten."

      # 1c. Vollständigen Repo-Stand holen
      - name: Fetch and reset to latest (full repo)
        run: |
          echo "[Git] Hole vollständigen Stand..."
          git fetch origin main
          git reset --hard origin/main
          echo "[Git] Vollständiger Repo-Stand ist nun synchron."

      # 2. Java 21 installieren
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 3. RAM prüfen
      - name: Check available RAM
        run: free -h

      # 4. Minecraft Server starten (max 15 GB RAM) + Autosave im Hintergrund
      - name: Start AutoSave & Minecraft Server
        run: |
          cd "$GITHUB_WORKSPACE/minecraft_server"
          java -Xms14G -Xmx14G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=15 -jar purpur.jar nogui
