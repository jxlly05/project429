name: Purpur Server Start Experimental

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  start-server:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository initialisieren – ohne Arbeitsverzeichnis-Checkout
      - name: Init minimal clone (no checkout)
        run: |
          echo "[Git] Erstelle Minimal-Clone..."
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git config core.sparseCheckout true
          echo "minecraft_server/ops.json" > .git/info/sparse-checkout
          git pull --depth=1 origin main
          echo "[Git] Minimaler Checkout (nur ops.json) abgeschlossen."

      # 1b. Kontrollausgabe – prüfen, ob nur ops.json vorhanden ist
      - name: Check repo content
        run: |
          echo "[Debug] Dateien im Repo:"
          ls -R minecraft_server || echo "Ordner minecraft_server leer"

      # 1c. Vollständigen Repo-Stand nachladen
      - name: Fetch full repo and reset
        run: |
          echo "[Git] Hole vollständigen Stand..."
          git config core.sparseCheckout false
          git fetch origin main
          git reset --hard origin/main
          echo "[Git] Vollständiger Repo-Stand ist jetzt synchron."

      # 2. Java 21 installieren
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 3. RAM prüfen
      - name: Check available RAM
        run: free -h

      # 4. Minecraft Server starten (max 15 GB RAM)
      - name: Start AutoSave & Minecraft Server
        run: |
          cd "$GITHUB_WORKSPACE/minecraft_server"
          java -Xms14G -Xmx14G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=15 -jar purpur.jar nogui
