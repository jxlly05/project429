name: Purpur Server Start - Experimental

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  start-server:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken – initial nur Kern-Dateien & eine Welt laden
      - name: Download Minecraft Server Files via SVN
        run: |
          set -e
      
          # Basis-URL deines Repos
          REPO_URL="https://github.com/jxlly05/project429/trunk/minecraft_server"
      
          # Liste aller Dateien / Ordner, die exportiert werden sollen
          PATHS=(
            bukkit.yml
            commands.yml
            eula.txt
            help.yml
            ops.json
            permissions.yml
            purpur.jar
            purpur.yml
            server.log
            server.pid
            server.properties
            server_output.log
            spigot.yml
            usercache.json
            version_history.json
            whitelist.json
            banned-ips.json
            banned-players.json
            cache
            config
            libraries
            logs
            plugins
            versions
            WeltMitKurosh
            WeltMitKurosh_nether
            WeltMitKurosh_the_end
          )
      
          # Exportiere jeden Pfad einzeln und zeige Fortschritt
          for p in "${PATHS[@]}"; do
            echo "[SVN Export] Lade $p..."
            svn export --force "$REPO_URL/$p" "$GITHUB_WORKSPACE/$p"
          done
      
          echo "[SVN Export] Alle Dateien und Welten wurden erfolgreich geladen."

      # 2. Java 21 installieren
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 3. RAM & Festplattenplatz prüfen
      - name: Check system memory and disk space
        run: |
          echo "==== RAM ===="
          free -h
          echo ""
          echo "==== Festplattenplatz auf Runner ===="
          df -h /

      # 4. Autosave + Minecraft Server Start
      - name: Start AutoSave & Minecraft Server
        run: |
          echo "[Autosave] Starte Hintergrund-Autosave-Prozess..."
          {
            while true; do
              cd "$GITHUB_WORKSPACE"
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"

              git add -A minecraft_server || true
              git commit -m "Force push Minecraft server data $(date)" >/dev/null 2>&1 || true
              git push origin HEAD:main --force >/dev/null 2>&1 || true

              echo "[Autosave] Repo save done at $(date '+%H:%M:%S')"
              sleep 60
            done
          } &
          AUTOSAVE_PID=$!
          echo "[Autosave] Hintergrundprozess gestartet mit PID $AUTOSAVE_PID"

          echo "[Server] Starte Minecraft Server..."
          cd "$GITHUB_WORKSPACE/minecraft_server"
          java -Xms14G -Xmx14G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=15 -jar purpur.jar nogui

          echo "[Autosave] Serverprozess beendet – beende Autosave-Prozess..."
          kill "$AUTOSAVE_PID" 2>/dev/null || true
          echo "[Autosave] Autosave vollständig gestoppt."

      # 5. Finaler Commit/PUSH
      - name: Force-push server data to repo
        run: |
          sleep 10
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jxlly05/project429.git
      
          [ -f ".git/index.lock" ] && rm -f .git/index.lock
      
          git add -A minecraft_server
          git commit -m "Auto-save Minecraft server data" || echo "No changes to commit"
      
          while true; do
            echo "[Autosave] Versuche, Änderungen zu pushen..."
            if git push origin HEAD:main --force; then
              echo "[Autosave] Push erfolgreich!"
              break
            else
              echo "[Autosave] Push fehlgeschlagen, warte 10 Sekunden..."
              sleep 10
            fi
          done
