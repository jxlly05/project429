name: Ping Logger

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"   # alle 5 Minuten (Minimum bei GitHub)

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Datei sicherstellen
        run: |
          if [ ! -f pings.txt ]; then
            touch pings.txt
          fi

      - name: IP & Region ermitteln
        id: region
        run: |
          IP=$(curl -s https://api.ipify.org)
          REGION=$(curl -s "https://ipinfo.io/$IP/region")
          
          echo "IP: $IP"
          echo "Region: $REGION"

          echo "region=$REGION" >> $GITHUB_OUTPUT

      - name: Ping messen (robust)
        id: ping
        run: |
          RESULT=$(ping -c 3 hetzner.de)

          echo "$RESULT"

          # Durchschnitt extrahieren
          PING=$(echo "$RESULT" | grep 'rtt' | awk -F'/' '{print $5}')

          # Fallback falls leer
          if [ -z "$PING" ]; then
            PING="N/A"
          fi

          echo "Ping: $PING ms"

          echo "ping=$PING" >> $GITHUB_OUTPUT

      - name: In Datei schreiben
        run: |
          echo "${{ steps.ping.outputs.ping }} ms: ${{ steps.region.outputs.region }}" >> pings.txt

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          git add pings.txt
          git commit -m "Update ping log" || echo "No changes"
          git push
