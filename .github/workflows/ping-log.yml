name: Runner Info Logger

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Datei sicherstellen
        run: |
          [ -f runners.txt ] || touch runners.txt

      - name: IP & Region ermitteln
        id: data
        run: |
          IP=$(curl -s https://api.ipify.org)
          REGION=$(curl -s "https://ipinfo.io/$IP/region")

          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')

          echo "ip=$IP" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: In Datei schreiben
        run: |
          echo "${{ steps.data.outputs.timestamp }} | ${{ steps.data.outputs.ip }} | ${{ steps.data.outputs.region }}" >> runners.txt

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add runners.txt
          git commit -m "Update runner log" || echo "No changes"
          git push

      - name: Selbst erneut starten (mit Schutz)
        env:
          GITHUB_PAT: ${{ secrets.MY_GITHUB_PAT }}
          WORKFLOW_FILE: ping-log.yml
        run: |
          # Schutz: maximal 1 neuer Run
          sleep 5

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_PAT" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$WORKFLOW_FILE/dispatches \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
          exit 1
