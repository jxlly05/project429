name: Ping Logger

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Datei sicherstellen
        run: |
          [ -f pings.txt ] || touch pings.txt

      - name: IP & Region ermitteln
        id: region
        run: |
          IP=$(curl -s https://api.ipify.org)
          REGION=$(curl -s "https://ipinfo.io/$IP/region")

          echo "region=$REGION" >> $GITHUB_OUTPUT

      - name: Ping messen (fehlertolerant)
        id: ping
        run: |
          # Ping ausführen, aber Fehler NICHT abbrechen lassen
          RESULT=$(ping -c 3 hetzner.de 2>/dev/null || true)

          echo "$RESULT"

          # Durchschnitt extrahieren
          PING=$(echo "$RESULT" | grep 'rtt' | awk -F'/' '{print $5}')

          # Falls kein Wert → Fallback
          if [ -z "$PING" ]; then
            PING="timeout"
          fi

          echo "ping=$PING" >> $GITHUB_OUTPUT

      - name: In Datei schreiben
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S') | ${{ steps.ping.outputs.ping }} ms | ${{ steps.region.outputs.region }}" >> pings.txt

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add pings.txt
          git commit -m "Update ping log" || echo "No changes"
          git push
