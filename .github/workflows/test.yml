name: Purpur Server Start - Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  start-server:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            minecraft_server/bukkit.yml
            minecraft_server/commands.yml
            minecraft_server/eula.txt
            minecraft_server/help.yml
            minecraft_server/ops.json
            minecraft_server/permissions.yml
            minecraft_server/purpur.jar
            minecraft_server/purpur.yml
            minecraft_server/server.log
            minecraft_server/server.pid
            minecraft_server/server.properties
            minecraft_server/server_output.log
            minecraft_server/spigot.yml
            minecraft_server/usercache.json
            minecraft_server/version_history.json
            minecraft_server/whitelist.json
            minecraft_server/banned-ips.json
            minecraft_server/banned-players.json
            minecraft_server/cache
            minecraft_server/config
            minecraft_server/libraries
            minecraft_server/logs
            minecraft_server/plugins
            minecraft_server/versions
            minecraft_server/WeltMitKurosh
            minecraft_server/WeltMitKurosh_nether
            minecraft_server/WeltMitKurosh_the_end



      # 2. ZIP entpacken (falls vorhanden)
      - name: Restore minimal server ZIP
        run: |
          if [ -f minecraft_server_minimal.zip ]; then
            echo "[Restore] Entpacke minecraft_server_minimal.zip..."
            rm -rf minecraft_server
            unzip minecraft_server_minimal.zip -d .
            echo "[Restore] Fertig."
          else
            echo "[Restore] Keine ZIP gefunden – erster Start."
          fi




      - name: Zip Server
        run: |
          cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"

            # ZIP neu erstellen
            zip -r minecraft_server_minimal.zip \
              minecraft_server/bukkit.yml \
              minecraft_server/commands.yml \
              minecraft_server/eula.txt \
              minecraft_server/help.yml \
              minecraft_server/ops.json \
              minecraft_server/permissions.yml \
              minecraft_server/purpur.jar \
              minecraft_server/purpur.yml \
              minecraft_server/server.log \
              minecraft_server/server.pid \
              minecraft_server/server.properties \
              minecraft_server/server_output.log \
              minecraft_server/spigot.yml \
              minecraft_server/usercache.json \
              minecraft_server/version_history.json \
              minecraft_server/whitelist.json \
              minecraft_server/banned-ips.json \
              minecraft_server/banned-players.json \
              minecraft_server/cache \
              minecraft_server/config \
              minecraft_server/libraries \
              minecraft_server/logs \
              minecraft_server/plugins \
              minecraft_server/versions \
              minecraft_server/WeltMitKurosh \
              minecraft_server/WeltMitKurosh_nether \
              minecraft_server/WeltMitKurosh_the_end >/dev/null

            git add -A
            git commit -m "Auto ZIP + Save $(date)" >/dev/null 2>&1 || true
            git push origin HEAD:main --force >/dev/null 2>&1 || true

            
